<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery with Modal</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 6px;
    }

    /* --- MODAL --- */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    #modalContent {
      background: white;
      padding: 10px;
      border-radius: 8px;
      max-width: 70%;
      max-height: 70%;
    }

    #modalContent img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

  </style>
</head>

<body>

  <h2>Image Gallery with Modal Preview</h2>

  <div class="gallery">
    <img src="https://picsum.photos/id/101/300/200" class="item">
    <img src="https://picsum.photos/id/102/300/200" class="item">
    <img src="https://picsum.photos/id/103/300/200" class="item">
    <img src="https://picsum.photos/id/104/300/200" class="item">
    <img src="https://picsum.photos/id/105/300/200" class="item">
    <img src="https://picsum.photos/id/106/300/200" class="item">
  </div>

  <div id="modal">
    <div id="modalContent">
      <img id="modalImg" src="">
    </div>
  </div>

  <script src="Image.js"></script>
</body>
</html>
