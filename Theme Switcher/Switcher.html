<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Theme Switcher</title>

  <style>
    body {
      transition: 0.3s;
      padding: 20px;
      font-family: Arial;
    }
    .light {
      background: #ffffff;
      color: #000000;
    }
    .dark {
      background: #121212;
      color: #ffffff;
    }

    /* BLUE THEME */
    .blue {
      background: #0d6efd;
      color: #ffffff;
    }

    button {
      margin-right: 10px;
      padding: 8px 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body data-theme="light">

  <h2>Theme Switcher (Light / Dark / Blue)</h2>

  <button id="lightBtn">Light</button>
  <button id="darkBtn">Dark</button>
  <button id="blueBtn">Blue</button>

  <script src="Switcher.js"></script>
</body>
</html>
