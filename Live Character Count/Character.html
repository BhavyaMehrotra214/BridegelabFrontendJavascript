<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Character Counter</title>

  <style>
    body { font-family: Arial; padding: 20px; }
    #counter {
      font-size: 18px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <h2>Live Character Counter (max 100)</h2>

  <textarea id="textInput" rows="6" cols="40" placeholder="Start typing..."></textarea>
  <div id="counter">100 characters remaining</div>

  <button id="resetBtn">Reset</button>

  <script src="q2.js"></script>
</body>
</html>
